# Backend tests (SQLite and PostgreSQL), linting and type checks for every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: API · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bolt
          POSTGRES_PASSWORD: bolt
          POSTGRES_DB: bolt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bolt -d bolt_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://bolt:bolt@localhost:5432/bolt_test
        run: pytest -q

  docker:
    name: API · Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: docker build -f backend/Dockerfile -t bolt-markets-api:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 -e ENVIRONMENT=development bolt-markets-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  frontend:
    name: Website · unit tests, build, links
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: bolt-markets
      VITE_SITE_URL: https://example.github.io/bolt-markets
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run check:links

  typecheck:
    # Strict TypeScript check of both React apps. Kept separate so a typing regression is reported
    # without blocking the Pages deployment, which only needs the Vite build to succeed.
    name: TypeScript · website and back office
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Website
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run typecheck
      - name: Back office
        working-directory: admin
        run: npm install --no-audit --no-fund && npm run typecheck
